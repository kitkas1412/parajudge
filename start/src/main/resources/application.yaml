spring:
  application:
    name: parajudge

  servlet:
    multipart:
      # The consolidated Bộ luật Lao động PDF is ~2 MB; the default cap is 1 MB.
      max-file-size: 20MB
      max-request-size: 20MB

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASS}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        show_sql: false
        format_sql: false

  ai:
    ollama:
      base-url: ${OLLAMA_HOST:http://localhost:11434}
      embedding:
        model: bge-m3
      init:
        pull-model-strategy: when_missing
        timeout: 10m
        embedding:
          include: true
        # Nothing here needs a chat model; without this the starter tries to pull one.
        chat:
          include: false

  cache:
    type: redis
    redis:
      time-to-live: 3600000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

parajudge:
  embedding:
    # Ollama xu ly ca lo trong mot request; 16 giu payload nho ma van tan dung batching.
    batch-size: 16
