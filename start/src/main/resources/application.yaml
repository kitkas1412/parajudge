spring:
  application:
    name: parajudge

  servlet:
    multipart:
      # The consolidated Bộ luật Lao động PDF is ~2 MB; the default cap is 1 MB.
      max-file-size: 20MB
      max-request-size: 20MB

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASS}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        show_sql: false
        format_sql: false

  ai:
    # Ca hai starter deu tu cau hinh mot ChatModel, nen phai chi ro ben nao lam gi —
    # neu khong ChatClient.Builder gap hai bean va app khong khoi dong duoc.
    model:
      chat: ollama
      embedding: ollama

    ollama:
      base-url: ${OLLAMA_HOST:http://localhost:11434}
      embedding:
        model: bge-m3
      chat:
        options:
          model: qwen3:8b
        # qwen3 la model co "thinking". Voi viec doc trich doan roi thuat lai thi phan
        # suy nghi khong them duoc gi: do thay tren cung mot cau hoi, bat thinking mat
        # 19.5s / 341 token, tat di con 3.4s / 59 token, cau tra loi giong nhau.
        think: false
      init:
        pull-model-strategy: when_missing
        timeout: 10m
        embedding:
          include: true
        chat:
          include: true

    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: claude-opus-5
          # Cau tra loi phap luat ngan; tran nay chi de chan truong hop chay dai.
          max-tokens: 4096

  cache:
    type: redis
    redis:
      time-to-live: 3600000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

parajudge:
  embedding:
    # Ollama xu ly ca lo trong mot request; 16 giu payload nho ma van tan dung batching.
    batch-size: 16
